<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f2a43">
  <link rel="manifest" href="gestao-manifest.webmanifest">
  <title>URBAM Frotas Gestão</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f7;font:16px system-ui;color:#14283d}.card{width:min(390px,calc(100% - 42px));padding:28px;background:#fff;border:1px solid #d6e1e8;border-radius:18px}h1{margin:0;color:#0f2a43}label{display:grid;gap:6px;margin:14px 0;font-weight:700;font-size:14px}input,button,a{padding:12px;border-radius:8px;font:inherit}input{border:1px solid #b8c7d2}button,a{width:100%;box-sizing:border-box;margin-top:10px;font-weight:800;cursor:pointer}.primary{border:0;background:#1477cf;color:#fff}.secondary{border:1px solid #1477cf;background:#fff;color:#1477cf}a.secondary{display:block;text-align:center;text-decoration:none}#message{min-height:22px;color:#526476;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>URBAM Frotas Gestão</h1><p>Entre para acessar o Painel da Base.</p>
    <form id="login"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" minlength="6" required></label><button class="primary">Entrar no painel</button></form>
    <p id="message">Contas de gestão são liberadas pelo Administrador Master.</p>
    <a class="secondary" href="./?v=162">← Voltar ao aplicativo do colaborador</a>
  </main>
  <script src="supabase-config.js?v=162"></script>
  <script>
    const c=window.CHECKFROTA_SUPABASE,$=id=>document.getElementById(id),m=t=>$('message').textContent=t,fields=()=>({email:$('email').value.trim(),password:$('password').value});
    async function requestAuth(p,b){const r=await fetch(c.url+p,{method:'POST',headers:{apikey:c.publishableKey,'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Não foi possível concluir');return d}
    $('login').onsubmit=async e=>{e.preventDefault();m('Entrando...');try{const d=await requestAuth('/auth/v1/token?grant_type=password',fields());sessionStorage.setItem('checkfrota-supabase-token',d.access_token);location.replace('./?gestao=1&v=151')}catch(e){m(e.message)}};
  </script>
</body>
</html>
