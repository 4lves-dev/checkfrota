<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2a43">
  <link rel="manifest" href="lider-manifest.webmanifest"><title>URBAM Frota Líder</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14283d;background:#eef4f7}*{box-sizing:border-box}body{margin:0}.top{background:#0f2a43;color:#fff;padding:22px max(18px,calc((100% - 1100px)/2));display:flex;gap:18px;align-items:center;justify-content:space-between}.top h1{font-size:24px;margin:0}.top p{margin:2px 0 0;color:#c9d9e6;font-size:14px}.top a{color:#d9f4ea;font-size:14px}.wrap{max-width:1100px;margin:24px auto;padding:0 18px 50px}.panel,.card{background:#fff;border:1px solid #d6e1e8;border-radius:14px;box-shadow:0 4px 18px #17324b0c}.panel{padding:18px;margin-bottom:18px}.bases{display:flex;gap:8px;flex-wrap:wrap}.bases button,.refresh,.approve,.refuse,.return{border:0;border-radius:8px;padding:10px 13px;font:700 14px system-ui;cursor:pointer}.bases button{background:#eaf1f5;color:#294b63}.bases button.active{background:#1477cf;color:#fff}.refresh{background:#0f2a43;color:#fff;margin-left:auto}.line{display:flex;gap:12px;align-items:center}.muted{color:#617486;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:17px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{font-size:17px;margin:0}.badge{white-space:nowrap;border-radius:999px;padding:5px 9px;background:#fff0ef;color:#a33c35;font-size:12px;font-weight:800}.badge.ok{background:#e8f7f0;color:#0b7657}.meta{margin:13px 0;color:#3d5367;font-size:14px;line-height:1.6}.problem{white-space:pre-wrap;padding:10px;background:#f5f8fa;border-radius:8px;font-size:14px}.photo{width:100%;max-height:220px;object-fit:contain;background:#f4f6f8;border-radius:9px;margin-top:12px;border:1px solid #d9e3e9}.actions{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}.approve{background:#0b7b5e;color:#fff}.refuse{background:#b33b3b;color:#fff}.return{background:#e58a22;color:#fff}.approved{padding:9px;background:#eff9f5;border-left:4px solid #0b7b5e;color:#16634e;font-size:13px;margin-top:12px}.empty{padding:34px;text-align:center;color:#617486;background:#fff;border:1px dashed #b7c8d4;border-radius:14px}.error{color:#ab3e36}.modal{position:fixed;inset:0;background:#0f2a4388;display:grid;place-items:center;padding:18px}.modal.hidden{display:none}.dialog{width:min(480px,100%);background:#fff;border-radius:14px;padding:20px}.dialog h2{margin:0}.dialog textarea{width:100%;min-height:90px;margin:12px 0;padding:10px;border:1px solid #b8c7d2;border-radius:8px;font:inherit}.dialog .actions{justify-content:flex-end}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.line{align-items:flex-start;flex-direction:column}.refresh{margin:0;width:100%}.bases button{flex:1}.actions button{flex:1}}
  </style>
</head>
<body>
  <header class="top"><div><h1>URBAM Frota Líder</h1><p>Chamados e ciência de manutenção da sua base</p></div><a href="index.html">Voltar ao aplicativo do colaborador</a></header>
  <main class="wrap"><section class="panel"><div class="line"><div><strong>Base da liderança</strong><div class="muted" id="count">Carregando chamados...</div></div><button class="refresh" id="refresh">↻ Atualizar</button></div><div class="bases" id="bases" style="margin-top:14px"></div></section><section id="list" class="grid"></section></main>
  <div class="modal hidden" id="modal"><section class="dialog"><h2 id="dialogTitle">Registrar decisão</h2><p class="muted" id="dialogText"></p><textarea id="note" placeholder="Observação para a gestão (opcional)"></textarea><div class="actions"><button class="refuse" id="cancel">Cancelar</button><button class="approve" id="confirm">Confirmar</button></div></section></div>
  <script src="supabase-config.js?v=1"></script><script>
  const CLOUD=window.CHECKFROTA_SUPABASE,$=s=>document.querySelector(s),bases=['Vertical','Horizontal','Abrigo','SASC'],requestedBase=new URLSearchParams(location.search).get('base');let current=bases.includes(requestedBase)?requestedBase:(localStorage.getItem('checkfrota-lider-base')||'Vertical'),issues=[],pending;if(bases.includes(requestedBase))localStorage.setItem('checkfrota-lider-base',requestedBase);
  const escape=s=>String(s||'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function drawBases(){ $('#bases').innerHTML=bases.map(b=>`<button class="${b===current?'active':''}" data-base="${b}">${b}</button>`).join(''); document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{current=b.dataset.base;localStorage.setItem('checkfrota-lider-base',current);drawBases();load()}) }
  function photoUrl(d){return d.photoUrl||(d.photoPath?`${CLOUD.url}/storage/v1/object/public/issue-photos/${d.photoPath.split('/').map(encodeURIComponent).join('/')}`:'')}
  function render(){const filtered=issues.filter(d=>(d.baseName||'').toLowerCase()===current.toLowerCase());$('#count').textContent=`${filtered.length} chamado(s) em ${current}`;$('#list').innerHTML=filtered.length?filtered.map((d,i)=>{const a=d.leaderApproval,photo=photoUrl(d);return `<article class="card"><div class="head"><h2>Prefixo ${escape(d.vehiclePrefix)} · ${escape(d.vehiclePlate)}</h2><span class="badge ${a?.status==='Aprovada'?'ok':''}">${escape(a?.status||d.status||'Pendente')}</span></div><div class="meta"><b>${escape(d.vehicleModel||d.vehicleType)}</b><br>Colaborador: ${escape(d.driver)}${d.driverRegistration?` · matrícula ${escape(d.driverRegistration)}`:''} · ${escape(d.odometer)} km<br>Aberto em: ${escape(new Date(d.createdAt||Date.now()).toLocaleString('pt-BR'))}</div><div class="problem"><b>Ocorrência</b><br>${escape(d.itemName)}${d.severity?' · '+escape(d.severity):''}<br>${escape(d.description)}</div>${photo?`<img class="photo" src="${photo}" alt="Foto do chamado" onerror="this.remove()">`:''}${a?`<div class="approved"><b>Decisão registrada:</b> ${escape(a.status)}${a.note?` · ${escape(a.note)}`:''}</div>`:`<div class="actions"><button class="approve" data-decision="Aprovada" data-id="${i}">Aprovar manutenção</button><button class="return" data-decision="Retificação solicitada" data-id="${i}">Devolver para retificação</button><button class="refuse" data-decision="Recusada" data-id="${i}">Recusar</button></div>`}</article>`}).join(''):`<div class="empty">Não há chamados pendentes para esta base.</div>`;document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>openDialog(filtered[Number(b.dataset.id)],b.dataset.decision))}
  async function load(){if(!CLOUD?.url){$('#list').innerHTML='<p class="error">A conexão com o banco não está configurada.</p>';return}$('#list').innerHTML='<div class="empty">Atualizando chamados...</div>';try{const r=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?select=data&order=created_at.desc`,{headers:{apikey:CLOUD.publishableKey}});if(!r.ok)throw new Error(r.status);issues=(await r.json()).map(x=>x.data).filter(Boolean);render()}catch(e){$('#list').innerHTML='<div class="empty error">Não foi possível carregar os chamados. Verifique a conexão e tente novamente.</div>';$('#count').textContent='Erro de conexão'}}
  function openDialog(issue,status){pending={issue,status};$('#dialogTitle').textContent=status==='Aprovada'?'Aprovar manutenção':status==='Retificação solicitada'?'Solicitar retificação':'Recusar solicitação';$('#dialogText').textContent=status==='Retificação solicitada'?`Informe o que deve ser corrigido. A devolução será enviada para ${issue.driver||'este colaborador'}${issue.driverRegistration?` · matrícula ${issue.driverRegistration}`:''}, no WhatsApp registrado no chamado.`:`Prefixo ${issue.vehiclePrefix} · ${issue.vehiclePlate}`;$('#note').value='';$('#modal').classList.remove('hidden')}
  async function saveDecision(){if(!pending)return;const {issue,status}=pending,note=$('#note').value.trim(),headers={apikey:CLOUD.publishableKey,'Content-Type':'application/json'};if(status==='Retificação solicitada'&&!note)return alert('Descreva o que o colaborador precisa corrigir.');try{const g=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(issue.id)}&select=data,status`,{headers}),row=(await g.json())[0];if(!row?.data)throw new Error();const data={...row.data,leaderApproval:{status,note,approvedAt:new Date().toISOString(),approvedBy:`Líder da Base ${current}`,dispatchStatus:status==='Aprovada'?'Aguardando gestor':status==='Retificação solicitada'?'Aguardando colaborador':'Encerrado'}};const rowStatus=status==='Aprovada'?'aprovada':status==='Retificação solicitada'?'retificacao':'recusada';const u=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(issue.id)}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({status:rowStatus,data})});if(!u.ok)throw new Error();if(status==='Retificação solicitada'&&issue.driverPhone){const link=`${location.origin}${location.pathname.replace(/[^/]*$/,'index.html')}?retificar=${encodeURIComponent(issue.id)}&matricula=${encodeURIComponent(issue.driverRegistration||'')}`;const message=`*CHECKFROTA — RETIFICAÇÃO NECESSÁRIA*\n\nColaborador: ${issue.driver||'—'}\nMatrícula: ${issue.driverRegistration||'—'}\nVeículo: Prefixo ${issue.vehiclePrefix||'—'} · ${issue.vehiclePlate||'—'}\nOcorrência: ${issue.itemName||'—'}\n\nA liderança solicitou a correção das informações:\n${note}\n\nAbra o aplicativo; a matrícula deste chamado será preenchida automaticamente:\n${link}`;window.open(`https://wa.me/${String(issue.driverPhone).replace(/\D/g,'')}?text=${encodeURIComponent(message)}`,'_blank','noopener')}$('#modal').classList.add('hidden');load()}catch(e){alert('Não foi possível registrar a decisão. Tente novamente.')}}
  $('#confirm').onclick=saveDecision;$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#refresh').onclick=load;drawBases();load();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js?v=98');
  </script>
</body></html>
