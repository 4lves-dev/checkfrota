  <style>

solid #dce7ed}.metric b{display:block;color:#5c7180;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.metric strong{display:block;margin-top:5px;font-size:26px;color:#073856}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.filters span{color:#546c7c;font-size:13px;font-weight:700}.filters button.active{background:#d9f1fb;color:#056694}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:15px}.card{position:relative;overflow:hidden;background:#fff;border:1px solid #dce7ed;border-radius:17px;box-shadow:0 5px 17px #173c5010}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:#e89a21}.card.ok:before{background:#159b70}.card.refused:before{background:#d45252}.card-main{padding:18px 18px 15px 22px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h3{font-size:17px;line-height:1.25;margin:0;color:#0b3855}.vehicle{margin-top:4px;color:#627886;font-size:13px}.status{white-space:nowrap;border-radius:999px;padding:5px 9px;background:#fff3db;color:#955400;font-size:11px;font-weight:800}.status.ok{background:#e6f8f0;color:#087052}.status.refused{background:#fff0f0;color:#a53535}.description{margin:14px 0 0;padding:11px 12px;border-radius:10px;background:#f4f8fa;color:#314c5d;font-size:14px;line-height:1.45}.description b{display:block;color:#173d55;margin-bottom:3px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 0}.fact{font-size:12px;color:#627786}.fact b{display:block;margin-top:2px;color:#203f52;font-size:13px}.photo{display:block;width:100%;height:170px;object-fit:cover;background:#edf3f6;border-top:1px solid #e1eaee}.decision{margin:14px 0 0;padding:10px;border-left:3px solid #159b70;background:#effaf5;color:#266553;font-size:13px;line-height:1.4}.card-actions{display:flex;gap:8px;padding:13px 18px 17px 22px}.card-actions .btn{flex:1;padding:10px 9px;font-size:13px}.approve{background:#08795d}.return{background:#d98617}.refuse{background:#bf4949}.empty{grid-column:1/-1;padding:42px 20px;text-align:center;border:1px dashed #adc4d1;border-radius:16px;background:#fff;color:#5d7482}.empty strong{display:block;color:#174560;margin-bottom:5px}.modal{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:18px;background:#062a4488;backdrop-filter:blur(3px)}.modal.hidden{display:none}.dialog{width:min(490px,100%);padding:23px;border-radius:18px;background:#fff;box-shadow:0 18px 45px #001e3380}.dialog h2{margin:0;color:#123c57;font-size:20px}.dialog textarea{display:block;width:100%;min-height:100px;margin:14px 0 0;padding:11px;border:1px solid #afc5d1;border-radius:10px;font:inherit;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.dialog-actions .btn{min-width:100px}.toast{position:fixed;z-index:20;right:18px;bottom:18px;max-width:min(380px,calc(100% - 36px));padding:13px 15px;border-radius:12px;background:#073856;color:#fff;box-shadow:0 8px 25px #062e4580;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.topbar,.dashboard{align-items:flex-start;flex-direction:column}.tools{justify-content:flex-start}.summary{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;align-items:center}.metric strong{margin:0}.card-actions{flex-wrap:wrap}.card-actions .btn{min-width:calc(50% - 5px)}.card-actions .refuse{min-width:100%}}@media(max-width:390px){.facts{grid-template-columns:1fr}.base-tabs button{flex:1}.card-actions .btn{min-width:100%}}

</head>
<body>
  <header class="top"><div class="topbar"><div class="brand"><div class="mark">✓</div><div><h1>URBAM Frota · Liderança</h1><p>Decisões rápidas e acompanhamento dos chamados da base</p></div></div><a class="back" href="index.html">Aplicativo do colaborador</a></div></header>
  <main class="wrap">
    <section class="dashboard"><div><h2>Painel de aprovação</h2><div class="muted" id="connection">Carregando chamados...</div><div class="base-tabs" id="bases"></div></div><div class="tools"><button class="btn outline" id="install" hidden>Instalar aplicativo</button><button class="btn bell" id="notifications">Ativar avisos</button><button class="btn" id="refresh">Atualizar</button></div></section>
    <section class="summary"><div class="metric"><b>Pendentes</b><strong id="pendingCount">—</strong></div><div class="metric"><b>Aprovados hoje</b><strong id="approvedCount">—</strong></div><div class="metric"><b>Total da base</b><strong id="totalCount">—</strong></div></section>
    <nav class="filters" id="filters"><span>Exibir:</span><button class="active" data-filter="pending">Pendentes</button><button data-filter="all">Todos</button><button data-filter="done">Decididos</button></nav>
    <section id="list" class="grid"></section>
  </main>
  <div class="modal hidden" id="modal"><section class="dialog"><h2 id="dialogTitle">Registrar decisão</h2><p class="muted" id="dialogText"></p><textarea id="note" placeholder="Observação para a gestão ou instrução para o colaborador."></textarea><div class="dialog-actions"><button class="btn outline" id="cancel">Cancelar</button><button class="btn" id="confirm">Confirmar</button></div></section></div><div class="toast" id="toast"></div>
  <script src="supabase-config.js?v=1"></script><script>
  const CLOUD=window.CHECKFROTA_SUPABASE,$=s=>document.querySelector(s),bases=['Vertical','Horizontal','Abrigo','SASC'],requestedBase=new URLSearchParams(location.search).get('base');
  let current=bases.includes(requestedBase)?requestedBase:(localStorage.getItem('checkfrota-lider-base')||'Vertical'),issues=[],filter='pending',pending,deferredPrompt,loadedOnce=false;
  if(bases.includes(requestedBase))localStorage.setItem('checkfrota-lider-base',requestedBase);
  const escape=s=>String(s||'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const photoUrl=d=>d.photoUrl||(d.photoPath?`${CLOUD.url}/storage/v1/object/public/issue-photos/${d.photoPath.split('/').map(encodeURIComponent).join('/')}`:'');
  const approval=d=>d.leaderApproval?.status||'';
  const statusClass=d=>approval(d)==='Aprovada'?'ok':approval(d)==='Recusada'?'refused':'';
  const dateText=d=>{try{return new Date(d.createdAt||Date.now()).toLocaleString('pt-BR')}catch{return '—'}};
  function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3600)}
  function drawBases(){ $('#bases').innerHTML=bases.map(b=>`<button class="${b===current?'active':''}" data-base="${b}">${b}</button>`).join('');document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{current=b.dataset.base;localStorage.setItem('checkfrota-lider-base',current);drawBases();load()}) }
  function filteredIssues(){const local=issues.filter(d=>(d.baseName||'').toLowerCase()===current.toLowerCase());return local.filter(d=>filter==='all'||(filter==='pending'?!approval(d):Boolean(approval(d))))}
  function render(){const baseIssues=issues.filter(d=>(d.baseName||'').toLowerCase()===current.toLowerCase()),visible=filteredIssues(),today=new Date().toLocaleDateString('pt-BR');$('#connection').textContent=`${baseIssues.length} chamado(s) registrados para a base ${current}`;$('#pendingCount').textContent=baseIssues.filter(d=>!approval(d)).length;$('#approvedCount').textContent=baseIssues.filter(d=>approval(d)==='Aprovada'&&new Date(d.leaderApproval.approvedAt||0).toLocaleDateString('pt-BR')===today).length;$('#totalCount').textContent=baseIssues.length;$('#list').innerHTML=visible.length?visible.map((d,i)=>{const a=d.leaderApproval,p=photoUrl(d),status=a?.status||d.status||'Pendente';return `<article class="card ${statusClass(d)}"><div class="card-main"><div class="card-head"><div><h3>Prefixo ${escape(d.vehiclePrefix)} · ${escape(d.vehiclePlate)}</h3><div class="vehicle">${escape(d.vehicleModel||d.vehicleType)}</div></div><span class="status ${statusClass(d)}">${escape(status)}</span></div><div class="description"><b>${escape(d.itemName||'Ocorrência')}</b>${escape(d.description||'Sem observação informada.')}</div><div class="facts"><div class="fact">Colaborador<b>${escape(d.driver)}${d.driverRegistration?` · ${escape(d.driverRegistration)}`:''}</b></div><div class="fact">Abertura<b>${escape(dateText(d))}</b></div><div class="fact">Quilometragem<b>${escape(d.odometer)} km</b></div><div class="fact">Tipo<b>${escape(d.itemCategory||'Manutenção')}</b></div></div>${a?`<div class="decision"><b>Decisão:</b> ${escape(a.status)}${a.note?`<br>${escape(a.note)}`:''}</div>`:''}</div>${p?`<img class="photo" src="${p}" alt="Foto do chamado" onerror="this.remove()">`:''}${a?'':`<div class="card-actions"><button class="btn approve" data-decision="Aprovada" data-id="${i}">Aprovar</button><button class="btn return" data-decision="Retificação solicitada" data-id="${i}">Retificar</button><button class="btn refuse" data-decision="Recusada" data-id="${i}">Recusar</button></div>`}</article>`}).join(''):`<div class="empty"><strong>Nenhum chamado encontrado.</strong>Troque o filtro ou atualize o painel.</div>`;document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>openDialog(visible[Number(b.dataset.id)],b.dataset.decision))}
  function updateNotificationButton(){const b=$('#notifications');if(!('Notification'in window)){b.hidden=true;return}if(Notification.permission==='granted'){b.textContent='Avisos ativados';b.disabled=true}else if(Notification.permission==='denied'){b.textContent='Avisos bloqueados';b.disabled=true}else b.textContent='Ativar avisos'}
  async function showNotification(title,body){if(!('Notification'in window)||Notification.permission!=='granted')return;try{const registration=await navigator.serviceWorker?.ready;if(registration)await registration.showNotification(title,{body,icon:'icons/icon.svg',tag:'urbam-lider-'+current,renotify:true});else new Notification(title,{body})}catch{new Notification(title,{body})}}
  function notifyNew(baseIssues){const key=`checkfrota-lider-known-${current}`,known=JSON.parse(localStorage.getItem(key)||'[]'),open=baseIssues.filter(d=>!approval(d)),ids=open.map(d=>d.id).filter(Boolean);if(loadedOnce){const newItems=open.filter(d=>d.id&&!known.includes(d.id));if(newItems.length)showNotification('Novo chamado para aprovação',`${newItems.length} novo(s) chamado(s) na base ${current}.`)}localStorage.setItem(key,JSON.stringify(ids));loadedOnce=true}
  async function load(){if(!CLOUD?.url){$('#list').innerHTML='<div class="empty"><strong>Conexão não configurada.</strong>Verifique a configuração do banco de dados.</div>';return}$('#list').innerHTML='<div class="empty"><strong>Atualizando painel...</strong>Aguarde alguns instantes.</div>';try{const r=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?select=data&order=created_at.desc`,{headers:{apikey:CLOUD.publishableKey}});if(!r.ok)throw new Error(r.status);issues=(await r.json()).map(x=>x.data).filter(Boolean);const baseIssues=issues.filter(d=>(d.baseName||'').toLowerCase()===current.toLowerCase());notifyNew(baseIssues);render()}catch(e){$('#list').innerHTML='<div class="empty"><strong>Não foi possível atualizar.</strong>Verifique a internet e tente novamente.</div>';$('#connection').textContent='Erro de conexão'}}
  function openDialog(issue,status){pending={issue,status};$('#dialogTitle').textContent=status==='Aprovada'?'Aprovar manutenção':status==='Retificação solicitada'?'Solicitar retificação':'Recusar solicitação';$('#dialogText').textContent=status==='Retificação solicitada'?`Explique o que ${issue.driver||'o colaborador'} deve corrigir no chamado.`:`Prefixo ${issue.vehiclePrefix} · ${issue.vehiclePlate}. Você poderá consultar esta decisão no histórico.`;$('#note').value='';$('#modal').classList.remove('hidden')}
  async function saveDecision(){if(!pending)return;const {issue,status}=pending,note=$('#note').value.trim(),headers={apikey:CLOUD.publishableKey,'Content-Type':'application/json'};if(status==='Retificação solicitada'&&!note)return alert('Descreva o que o colaborador precisa corrigir.');try{const g=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(issue.id)}&select=data,status`,{headers}),row=(await g.json())[0];if(!row?.data)throw new Error();const data={...row.data,leaderApproval:{status,note,approvedAt:new Date().toISOString(),approvedBy:`Líder da Base ${current}`,dispatchStatus:status==='Aprovada'?'Aguardando gestor':status==='Retificação solicitada'?'Aguardando colaborador':'Encerrado'}};const rowStatus=status==='Aprovada'?'aprovada':status==='Retificação solicitada'?'retificacao':'recusada';const u=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(issue.id)}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({status:rowStatus,data})});if(!u.ok)throw new Error();if(status==='Retificação solicitada'&&issue.driverPhone){const link=`${location.origin}${location.pathname.replace(/[^/]*$/,'index.html')}?retificar=${encodeURIComponent(issue.id)}&matricula=${encodeURIComponent(issue.driverRegistration||'')}`,message=`*CHECKFROTA — RETIFICAÇÃO NECESSÁRIA*\n\nVeículo: Prefixo ${issue.vehiclePrefix||'—'} · ${issue.vehiclePlate||'—'}\n\nCorreção solicitada:\n${note}\n\nAbra o aplicativo para corrigir o checklist:\n${link}`;window.open(`https://wa.me/${String(issue.driverPhone).replace(/\D/g,'')}?text=${encodeURIComponent(message)}`,'_blank','noopener')}$('#modal').classList.add('hidden');toast(status==='Aprovada'?'Manutenção aprovada e enviada para o gestor.':'Decisão registrada com sucesso.');load()}catch(e){alert('Não foi possível registrar a decisão. Tente novamente.')}}
  $('#confirm').onclick=saveDecision;$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#refresh').onclick=load;$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};$('#notifications').onclick=async()=>{if(!('Notification'in window))return;if(Notification.permission==='default')await Notification.requestPermission();updateNotificationButton();if(Notification.permission==='granted'){toast('Avisos ativados neste dispositivo.');showNotification('URBAM Frota Líder','Os avisos de novos chamados estão ativos.')}};addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#install').hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js?v=115');drawBases();updateNotificationButton();load();setInterval(load,60000);
  </script>
</body></html>
