<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2a43" />
  <title>Instalar CheckFrota</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f7;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#14283d}
    main{max-width:420px;margin:24px;padding:28px;text-align:center;background:#fff;border:1px solid #d6e1e8;border-radius:18px;box-shadow:0 8px 28px #152a3d18}
    h1{margin:0 0 8px;color:#0f2a43}p{margin:0 0 18px;color:#526476}.qr{width:min(320px,100%);padding:10px;background:#fff;border:1px solid #d6e1e8;border-radius:12px}.button{display:block;margin:18px 0;padding:13px;background:#1477cf;border-radius:9px;color:#fff;text-decoration:none;font-weight:800}.steps{text-align:left;background:#eef4f7;border-radius:10px;padding:14px;font-size:14px}.steps b{color:#0f2a43}
  </style>
</head>
<body><main>
  <h1>CheckFrota Motoristas</h1>
  <p>Aponte a câmera do celular para o QR Code ou toque no botão abaixo.</p>
  <img class="qr" alt="QR Code para abrir o CheckFrota" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&amp;data=https%3A%2F%2F4lves-dev.github.io%2Fcheckfrota%2F%3Fv%3D31" />
  <a class="button" href="https://4lves-dev.github.io/checkfrota/?v=31">Abrir CheckFrota</a>
  <div class="steps"><b>Para instalar:</b><br>Abra o link no celular e escolha <em>Instalar aplicativo</em> no navegador. No iPhone, use Compartilhar → Adicionar à Tela de Início.</div>
</main></body>
</html>
