<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f2a43">
  <title>URBAM Frota | Aprovação de manutenção</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#14283d;background:#eef4f7}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100% - 760px)/2));background:#0f2a43;color:#fff}header a{color:#d7f1e9;text-decoration:none;font-size:14px}h1{font-size:27px;margin:6px 0 2px}header p{margin:0;opacity:.8}.wrap{max-width:760px;margin:28px auto;padding:0 20px 48px}.card{background:#fff;border:1px solid #d6e1e8;border-radius:14px;padding:22px;box-shadow:0 5px 18px #152a3d0c}h2{margin:0 0 6px}.hint{color:#5c6d7e}.details{white-space:pre-wrap;border-top:1px solid #d6e1e8;padding-top:13px;line-height:1.5}.photo{display:block;width:100%;max-height:420px;object-fit:contain;margin-top:16px;border:1px solid #d6e1e8;border-radius:10px;background:#f6f8fa}label{display:grid;gap:6px;margin-top:18px;font-weight:700;font-size:14px}textarea{min-height:92px;padding:10px;border:1px solid #b8c7d2;border-radius:8px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:8px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer}.approve{background:#0b7b5e;color:#fff}.return{background:#e58a22;color:#fff}.refuse{background:#b33b3b;color:#fff}.secondary{background:#fff;border:1px solid #8ca7b8;color:#17405c}.whatsapp{background:#1fac59;color:#fff}.hidden{display:none}.decision{margin-top:18px;padding:12px;border-left:4px solid #0b7b5e;background:#eff9f5}.decision.refused{border-color:#b33b3b;background:#fff3f3}.decision.returned{border-color:#e58a22;background:#fff7eb}.maintenance-message{margin-top:16px;padding:16px;border:1px solid #b9d9cc;border-radius:10px;background:#f5fcf8}.maintenance-message h3{margin:0 0 5px;color:#0b644d}.maintenance-message p{margin:0;color:#4e6a60;font-size:13px}.maintenance-message textarea{min-height:260px;margin-top:12px;background:#fff;line-height:1.45}.maintenance-message .actions{margin-top:10px}@media(max-width:600px){.actions button{width:100%}}
  </style>
</head>
<body>
  <header><a href="index.html">← Voltar ao URBAM Frota</a><h1>URBAM Frota · Aprovação</h1><p>Solicitação e ciência de manutenção</p></header>
  <main class="wrap"><section class="card"><h2>Aprovação do líder</h2><p class="hint">Confira o chamado e a foto antes de registrar sua decisão.</p><p id="ticket"></p><div class="details" id="details"></div><img class="photo hidden" id="photo" alt="Foto anexada ao chamado"><label>Observação do líder<textarea id="note" placeholder="Ex.: autorizado levar à oficina indicada ou descreva a retificação necessária."></textarea></label><div class="actions"><button class="approve" id="approve">Aprovar manutenção</button><button class="return" id="returnDriver">Devolver para retificação</button><button class="refuse" id="refuse">Recusar solicitação</button></div><div class="hidden" id="decision"></div></section></main>
  <script src="supabase-config.js?v=1"></script><script>
    const $=id=>document.getElementById(id),clean=p=>String(p||'').replace(/\D/g,''),q=new URLSearchParams(location.search),r=Object.fromEntries(q.entries()),truckMaintenance='5512996181645',CLOUD=window.CHECKFROTA_SUPABASE;
    const maintenanceTarget=truckMaintenance;
    const maintenanceRecipient='Grupo de manutenção';
    function text(){return `Solicitação: ${r.id||'—'}\nVeículo: Prefixo ${r.prefix||'—'} · ${r.type||''} · ${r.plate||''}\nColaborador: ${r.driver||'—'}\nMatrícula: ${r.driverRegistration||'—'}\nKM: ${r.km||'—'}\nBase: ${r.baseName||'—'}\nPrioridade: ${r.priority||'—'}\nProblema: ${r.problem||'—'}`}
    $('ticket').textContent=r.id||'Solicitação de manutenção';$('details').textContent=text();
    if(r.photoUrl){const p=$('photo');p.src=r.photoUrl;p.classList.remove('hidden');p.onerror=()=>{p.classList.add('hidden');alert('A foto não está mais disponível. Solicite um novo envio ao motorista.')}}
    function maintenanceText(note){return `*SOLICITAÇÃO DE ABERTURA DE MANUTENÇÃO*\n\nPrezado(a) responsável pela manutenção,\n\nSolicito a abertura de chamado para avaliação e manutenção do veículo abaixo.\n\n*Protocolo:* ${r.id||'—'}\n*Veículo:* Prefixo ${r.prefix||'—'} · ${r.type||'—'} · Placa ${r.plate||'—'}\n*Quilometragem:* ${r.km||'—'} km\n*Base responsável:* ${r.baseName||'—'}\n\n*Problema relatado:*\n${r.problem||'—'}\n\nSolicito, por gentileza, registrar o chamado, informar a oficina/responsável e retornar com a previsão de atendimento.\n\nAtenciosamente,\nCheckFrota — Gestão de Manutenção`}
    async function saveForManager(status,note,message){if(!r.issueId||!CLOUD?.url)return;try{const headers={apikey:CLOUD.publishableKey,'Content-Type':'application/json'},get=await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(r.issueId)}&select=data,status`,{headers}),rows=await get.json(),row=rows?.[0];if(!row?.data)return;const data={...row.data,leaderApproval:{status,note,approvedAt:new Date().toISOString(),approvedBy:`Líder da Base ${r.baseName||'não informada'}`,maintenanceMessage:message,dispatchStatus:status==='Aprovada'?'Aguardando gestor':status==='Retificação solicitada'?'Aguardando motorista':'Encerrado'}};const rowStatus=status==='Aprovada'?(row.status||'aberta'):status==='Retificação solicitada'?'retificacao':'recusada';await fetch(`${CLOUD.url}/rest/v1/fleet_issues?id=eq.${encodeURIComponent(r.issueId)}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({status:rowStatus,data})})}catch(error){console.warn('Não foi possível registrar no painel do gestor',error)}}
    async function decide(status){const note=$('note').value.trim();if(status==='Retificação solicitada'&&!note)return alert('Descreva a correção que o colaborador precisa fazer.');const returnWindow=status==='Retificação solicitada'&&r.driverPhone?window.open('about:blank','_blank'):null,message=status==='Aprovada'?maintenanceText(note):'';localStorage.setItem('aprovafrota-'+(r.id||Date.now()),JSON.stringify({...r,status,note,decidedAt:new Date().toISOString()}));const box=$('decision');box.className='decision '+(status==='Aprovada'?'':status==='Retificação solicitada'?'returned':'refused');box.textContent=status==='Aprovada'?'Manutenção aprovada. A solicitação foi encaminhada ao painel do gestor para revisão e envio.':status==='Retificação solicitada'?`Retificação solicitada para ${r.driver||'o colaborador'}${r.driverRegistration?` · matrícula ${r.driverRegistration}`:''}.`:'Solicitação recusada.';box.classList.remove('hidden');await saveForManager(status,note,message);if(status==='Retificação solicitada'&&r.driverPhone){const link=`${location.origin}${location.pathname.replace(/[^/]*$/,'index.html')}?retificar=${encodeURIComponent(r.issueId||r.id||'')}&matricula=${encodeURIComponent(r.driverRegistration||'')}`,msg=`*CHECKFROTA — RETIFICAÇÃO NECESSÁRIA*\n\nColaborador: ${r.driver||'—'}\nMatrícula: ${r.driverRegistration||'—'}\nVeículo: Prefixo ${r.prefix||'—'} · ${r.plate||'—'}\nOcorrência: ${r.problem||'—'}\n\nA liderança solicitou a correção das informações:\n${note}\n\nAbra o aplicativo; a matrícula deste chamado será preenchida automaticamente:\n${link}`,url=`https://wa.me/${clean(r.driverPhone)}?text=${encodeURIComponent(msg)}`;if(returnWindow)returnWindow.location.href=url;else window.open(url,'_blank','noopener')}}
    $('approve').onclick=()=>decide('Aprovada');$('returnDriver').onclick=()=>decide('Retificação solicitada');$('refuse').onclick=()=>decide('Recusada');
  </script>
</body>
</html>
