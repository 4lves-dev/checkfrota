<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f2a43">
  <title>AprovaFrota | Manutenção</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#14283d;background:#eef4f7}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100% - 760px)/2));background:#0f2a43;color:#fff}header a{color:#d7f1e9;text-decoration:none;font-size:14px}h1{font-size:27px;margin:6px 0 2px}header p{margin:0;opacity:.8}.wrap{max-width:760px;margin:28px auto;padding:0 20px 48px}.card{background:#fff;border:1px solid #d6e1e8;border-radius:14px;padding:22px;box-shadow:0 5px 18px #152a3d0c}h2{margin:0 0 6px}.hint{color:#5c6d7e}.details{white-space:pre-wrap;border-top:1px solid #d6e1e8;padding-top:13px;line-height:1.5}.photo{display:block;width:100%;max-height:420px;object-fit:contain;margin-top:16px;border:1px solid #d6e1e8;border-radius:10px;background:#f6f8fa}label{display:grid;gap:6px;margin-top:18px;font-weight:700;font-size:14px}textarea{min-height:92px;padding:10px;border:1px solid #b8c7d2;border-radius:8px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:8px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer}.approve{background:#0b7b5e;color:#fff}.refuse{background:#b33b3b;color:#fff}.secondary{background:#fff;border:1px solid #8ca7b8;color:#17405c}.whatsapp{background:#1fac59;color:#fff}.hidden{display:none}.decision{margin-top:18px;padding:12px;border-left:4px solid #0b7b5e;background:#eff9f5}.decision.refused{border-color:#b33b3b;background:#fff3f3}.maintenance-message{margin-top:16px;padding:16px;border:1px solid #b9d9cc;border-radius:10px;background:#f5fcf8}.maintenance-message h3{margin:0 0 5px;color:#0b644d}.maintenance-message p{margin:0;color:#4e6a60;font-size:13px}.maintenance-message textarea{min-height:260px;margin-top:12px;background:#fff;line-height:1.45}.maintenance-message .actions{margin-top:10px}@media(max-width:600px){.actions button{width:100%}}
  </style>
</head>
<body>
  <header><a href="index.html">← Voltar ao CheckFrota</a><h1>AprovaFrota</h1><p>Solicitação e ciência de manutenção</p></header>
  <main class="wrap"><section class="card"><h2>Aprovação do líder</h2><p class="hint">Confira o chamado e a foto antes de registrar sua decisão.</p><p id="ticket"></p><div class="details" id="details"></div><img class="photo hidden" id="photo" alt="Foto anexada ao chamado"><label>Observação do líder<textarea id="note" placeholder="Ex.: autorizado levar à oficina indicada."></textarea></label><div class="actions"><button class="approve" id="approve">Aprovar manutenção</button><button class="refuse" id="refuse">Recusar solicitação</button></div><div class="hidden" id="decision"></div><section class="maintenance-message hidden" id="maintenanceMessage"><h3>Mensagem para abertura de manutenção</h3><p>Mensagem padronizada pronta para copiar e enviar.</p><textarea id="messageText" readonly aria-label="Mensagem de abertura de manutenção"></textarea><div class="actions"><button class="secondary" id="copyMessage">Copiar mensagem</button><button class="whatsapp" id="sendMessage">Abrir WhatsApp da manutenção</button></div></section></section></main>
  <script>
    const $=id=>document.getElementById(id),clean=p=>String(p||'').replace(/\D/g,''),q=new URLSearchParams(location.search),r=Object.fromEntries(q.entries()),truckMaintenance='5512996181645';
    const maintenanceTarget=clean(r.ownerPhone)||truckMaintenance;
    const maintenanceRecipient=r.ownerName||'Manutenção de caminhões';
    function text(){return `Solicitação: ${r.id||'—'}\nVeículo: Prefixo ${r.prefix||'—'} · ${r.type||''} · ${r.plate||''}\nMotorista: ${r.driver||'—'}\nKM: ${r.km||'—'}\nBase: ${r.baseName||'—'}\nPrioridade: ${r.priority||'—'}\nProblema: ${r.problem||'—'}`}
    $('ticket').textContent=r.id||'Solicitação de manutenção';$('details').textContent=text();
    if(r.photoUrl){const p=$('photo');p.src=r.photoUrl;p.classList.remove('hidden');p.onerror=()=>{p.classList.add('hidden');alert('A foto não está mais disponível. Solicite um novo envio ao motorista.')}}
    function maintenanceText(note){return `*SOLICITAÇÃO DE ABERTURA DE MANUTENÇÃO*\n\nPrezado(a) responsável pela manutenção,\n\nSolicito a abertura de chamado para avaliação e manutenção do veículo abaixo.\n\n*Protocolo:* ${r.id||'—'}\n*Veículo:* Prefixo ${r.prefix||'—'} · ${r.type||'—'} · Placa ${r.plate||'—'}\n*Quilometragem:* ${r.km||'—'} km\n*Base responsável:* ${r.baseName||'—'}\n*Motorista:* ${r.driver||'—'}\n*Prioridade:* ${r.priority||'—'}\n\n*Problema relatado:*\n${r.problem||'—'}\n\n*Situação:* Manutenção aprovada pelo líder da Base ${r.baseName||'não informada'}.\n${note?`*Observação da liderança:* ${note}\n`:''}\nSolicito, por gentileza, registrar o chamado, informar a oficina/responsável e retornar com a previsão de atendimento.\n\nAtenciosamente,\nCheckFrota — Gestão de Manutenção`}
    function decide(status){const note=$('note').value.trim();localStorage.setItem('aprovafrota-'+(r.id||Date.now()),JSON.stringify({...r,status,note,decidedAt:new Date().toISOString()}));const box=$('decision');box.className='decision '+(status==='Aprovada'?'':'refused');box.textContent=status==='Aprovada'?`Manutenção aprovada. A mensagem de abertura foi gerada para ${maintenanceRecipient}.`:'Solicitação recusada.';box.classList.remove('hidden');if(status==='Aprovada'){$('messageText').value=maintenanceText(note);$('sendMessage').textContent=`Abrir WhatsApp — ${maintenanceRecipient}`;$('maintenanceMessage').classList.remove('hidden')}else $('maintenanceMessage').classList.add('hidden')}
    $('copyMessage').onclick=async()=>{try{await navigator.clipboard.writeText($('messageText').value);$('copyMessage').textContent='Mensagem copiada ✓';setTimeout(()=>$('copyMessage').textContent='Copiar mensagem',1800)}catch{$('messageText').select();document.execCommand('copy');alert('Mensagem copiada.')}};
    $('sendMessage').onclick=()=>window.open(`https://wa.me/${maintenanceTarget}?text=${encodeURIComponent($('messageText').value)}`,'_blank','noopener');
    $('approve').onclick=()=>decide('Aprovada');$('refuse').onclick=()=>decide('Recusada');
  </script>
</body>
</html>
