<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f2a43">
  <title>Instalar URBAM Frotas Líder</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#14283d;background:#eef4f7}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{box-sizing:border-box;width:min(540px,calc(100% - 32px));padding:30px;background:#fff;border:1px solid #d6e1e8;border-radius:20px;box-shadow:0 12px 30px #17324b18;text-align:center}h1{margin:0 0 8px;color:#0f2a43;font-size:clamp(25px,6vw,34px)}p{color:#526476;line-height:1.55}a,button{display:block;box-sizing:border-box;width:100%;padding:14px 16px;border:0;border-radius:10px;background:#1477cf;color:#fff;text-decoration:none;font:700 16px system-ui;cursor:pointer}#install{display:none;margin-top:12px;background:#0f2a43}.hint{font-size:14px}
  </style>
</head>
<body><main class="card"><h1>URBAM Frotas Líder</h1><p>Aplicativo da liderança para visualizar os chamados da base, conferir fotos, receber avisos e registrar decisões.</p><a id="leaderLink" href="lider.html?v=168">Abrir aplicativo do líder</a><button id="install" type="button">Instalar no dispositivo</button><p class="hint">No celular, abra no Chrome e escolha <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b>.</p></main><script>const base=new URLSearchParams(location.search).get('base'),allowed=['Vertical','Horizontal','Abrigo','SASC'];if(allowed.includes(base)){localStorage.setItem('checkfrota-lider-base',base);document.querySelector('#leaderLink').href='lider.html?v=168&base='+encodeURIComponent(base)}let p;const b=document.querySelector('#install');addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;b.style.display='block'});b.onclick=async()=>{if(!p)return;p.prompt();await p.userChoice;p=null;b.style.display='none'}</script></body>
</html>
